[package]
name = "beacon"
version = "0.1.0"
edition = "2021"
description = "Beacon – BitVM3-style dispute layer for Cube"
license = "MIT"

[[example]]
name = "phase_a_driver"
path = "examples/phase_a_driver.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoin = { version = "0.32", features = ["rand-std"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
rand = "0.8"
