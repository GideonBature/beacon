[workspace]
resolver = "2"
members = [
    "crates/beacon-core",
    "crates/beacon-events",
    "crates/beacon-mock",
    "crates/beacon-cli",
    "crates/beacon-groth16",
]
default-members = [
    "crates/beacon-core",
    "crates/beacon-events",
    "crates/beacon-mock",
    "crates/beacon-cli",
    "crates/beacon-groth16",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Beacon Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
