[package]
name = "beacon"
version = "0.1.0"
edition = "2021"
description = "Beacon – BitVM3-style dispute layer for Cube"
license = "MIT"
rust-version = "1.90"

[[example]]
name = "phase_a_driver"
path = "examples/phase_a_driver.rs"

[[example]]
name = "gsv_link"
path = "examples/gsv_link.rs"
required-features = ["gsv"]

[[example]]
name = "phase_c_garble"
path = "examples/phase_c_garble.rs"
required-features = ["gsv"]

[[example]]
name = "phase_c_plus"
path = "examples/phase_c_plus.rs"
required-features = ["gsv"]

[features]
default = ["gsv"]
# Link BitVM/garbled-snark-verifier from GitHub. That crate is GPL-3.0-only.
gsv = ["dep:garbled-snark-verifier", "dep:crossbeam", "dep:rand_chacha"]
# Optional VSSS share reconstruction via upstream `vsss` feature (no SP1 soldering).
gsv-vsss = ["gsv", "garbled-snark-verifier/vsss", "dep:ark-ff", "dep:ark-secp256k1"]
# Alias: Phase C+ garbled Groth16 (same as `gsv` today; documents intent).
gsv-groth16 = ["gsv"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoin = { version = "0.32", features = ["rand-std"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
rand = "0.8"
bitcoincore-rpc = "0.19"
crossbeam = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
ark-ff = { version = "0.5", optional = true }
ark-secp256k1 = { version = "0.5", optional = true }
# Track upstream; no vendored copy. `default-features = false` avoids enabling
# soldering/VSSS by default (SP1 build-deps still resolve from their Cargo.toml).
garbled-snark-verifier = { git = "https://github.com/BitVM/garbled-snark-verifier", default-features = false, features = ["test-utils"], optional = true }
