# Copy to docker-compose.yml (gitignored) and run:
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#   export BEACON_RPC_URL=http://127.0.0.1:18443
#   export BEACON_RPC_USER=beacon
#   export BEACON_RPC_PASS=beacon
#   cargo run --example phase_a_driver -- --regtest

services:
  bitcoind:
    image: bitcoin/bitcoin:27.1
    container_name: beacon-bitcoind-regtest
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -printtoconsole
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=beacon
      - -rpcpassword=beacon
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18443
      - -port=18444
      # AssertWitnessV1 OP_RETURN can exceed the default 83-byte datacarrier.
      - -datacarriersize=100000
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - ./docker/bitcoin-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=beacon", "-rpcpassword=beacon", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
