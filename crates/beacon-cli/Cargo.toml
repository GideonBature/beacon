[package]
name = "beacon-cli"
description = "Developer CLI for Beacon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "beacon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ark-bn254 = "0.6"
beacon-bitcoin = { path = "../beacon-bitcoin" }
beacon-core = { path = "../beacon-core" }
beacon-events = { path = "../beacon-events" }
beacon-groth16 = { path = "../beacon-groth16" }
beacon-mock = { path = "../beacon-mock" }
clap = { version = "4", features = ["derive"] }
