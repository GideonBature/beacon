[package]
name = "beacon-groth16"
description = "Groth16 Verifiable adapter for Beacon (verify-only; Cube-facing proof path)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
beacon-core = { path = "../beacon-core" }
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-groth16 = "0.6"
ark-serialize = { version = "0.6", features = ["derive"] }
ark-snark = "0.6"
ark-relations = "0.6"
ark-std = { version = "0.6", features = ["std"] }

[dev-dependencies]
beacon-mock = { path = "../beacon-mock" }
beacon-events = { path = "../beacon-events" }
